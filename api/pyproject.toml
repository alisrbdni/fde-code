# Same shape as the `telnyx-edge new-func -l python` scaffold: the deployable package is ./function
# (function/__init__.py exposes new()). Runtime is standard library only, so there are no dependencies.
[project]
name = "function"
description = "Agent Forge: Telnyx Edge Function that builds voice AI agents"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["function"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
