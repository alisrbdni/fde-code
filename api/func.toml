# forge-api: Telnyx Edge Function manifest (Python, standard library only).
# Format per https://developers.telnyx.com/docs/edge-compute/configuration. There is no language or
# entry key: the runtime comes from the project files. Like the Python scaffold, the entry is
# `function/__init__.py` → `new()` returning an object with an ASGI 3 `handle(scope, receive, send)`.
# Run `telnyx-edge new-func -l python -n forge-api` in a scratch folder and compare its files with ours.

[edge_compute]
func_id = "3cb24047-7dfa-43c7-af2c-d67ac47c0bb4"
func_name = "forge-api"
timeout_seconds = 30

# Non-secret configuration, read as process environment variables.
[env_vars]
API_URL = "https://forge-api-3cb24047-7.telnyxcompute.com"
STATE_URL = "https://forge-state-08d0ac2c-f.telnyxcompute.com"
KV_NAMESPACE_ID = "c9ecd641-1027-4bef-ae25-e7eab17140a1"
TEXML_APP_ID = "3086920981852194349"
FORGE_NUMBER = "+61742854682"
ASSISTANT_MODEL = "moonshotai/Kimi-K2.6"
POLISH_MODEL = "zai-org/GLM-5.3-Flash"
CHAT_MODEL = ""
LOG_LEVEL = "info"
VERIFY_SIGNATURES = "false"
TELNYX_PUBLIC_KEY = ""
STORAGE_ENDPOINT = ""
STORAGE_BUCKET = "agent-forge"
STORAGE_REGION = "us-central-1"
CLINIC_ASSISTANT_ID = "assistant-7006f7c6-203d-47e0-a3f1-2890acb8c98b"
CLINIC_FRONT_DESK_NUMBER = ""
CLINIC_UTC_OFFSET = "-05:00"
REQUIRE_TOKENS = "true"
FORGE_ASSISTANT_ID = "assistant-61126c7a-f78d-4711-b706-bfe846e2e616"

# Secrets are org-wide: `telnyx-edge secrets add NAME "<value>"`. They are injected as environment
# variables; the code reads os.environ[NAME].
[[secrets]]
binding = "MCP_TOKEN"
name = "MCP_TOKEN"

[[secrets]]
binding = "ADMIN_TOKEN"
name = "ADMIN_TOKEN"

[[secrets]]
binding = "STATE_TOKEN"
name = "STATE_TOKEN"

# TELNYX_API_KEY comes from the org secret of the same name (`telnyx-edge secrets add TELNYX_API_KEY ...`).
# KV REST, the Assistants API, TeXML and Inference all use it.

# The KV namespace. Python reaches it over the REST API with KV_NAMESPACE_ID above; this
# declaration also attaches it to the function.
[storage.kv.FORGE_KV]
id = "c9ecd641-1027-4bef-ae25-e7eab17140a1"
