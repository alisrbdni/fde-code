# forge-state: TypeScript Edge Function hosting the Stateful Actors (umbrella manifest).
# Format per https://developers.telnyx.com/docs/edge-compute/configuration : [[actors]] uses
# `binding` (the env handle the code uses) and `type` (a class exported from `main`).
name = "forge-state"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[[actors]]
binding = "BUILDER"
type = "BuilderProfile"

[[actors]]
binding = "OPS"
type = "OpsMetrics"

[[actors]]
binding = "REGISTRY"
type = "AgentRegistry"

[[actors]]
binding = "SCHEDULE"
type = "ClinicSchedule"

[[actors]]
binding = "PATIENT"
type = "ClinicPatient"

[[actors]]
binding = "DESK"
type = "ClinicDesk"

[edge_compute]
func_id = "08d0ac2c-f2cc-456c-9f12-a20118c05587"
func_name = "forge-state"
